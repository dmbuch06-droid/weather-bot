name: Weather Market Scan

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one weather market scan
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_RELAY_URL: ${{ secrets.DISCORD_RELAY_URL }}
          DISCORD_RELAY_SECRET: ${{ secrets.DISCORD_RELAY_SECRET }}
          KALSHI_API_URL: ${{ secrets.KALSHI_API_URL }}
        run: python scanner.py
